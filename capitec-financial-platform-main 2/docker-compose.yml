# Transaction Aggregation API — local infrastructure and services.
# Copy .env.example to .env, configure secrets, and run docker compose up --build -d.
name: transaction-aggregation-api

x-service-defaults: &service-defaults
  restart: unless-stopped
  # CPU: no hard quota (cpus:) on purpose. A quota throttled JVM startup (measured: 5-7% of CFS
  # periods throttled, slowing Spring context init 5x). Containers share CPU fairly under contention
  # via equal cpu_shares (the default), and an idle JVM uses almost no CPU, so idle usage stays low.
  # Memory is still hard-capped per container (mem_limit).
  # Docker's embedded DNS occasionally times out when the VM is loaded; a single lookup failure
  # (EAI_AGAIN) used to crash a service at startup or fail a seed call. Give resolution more room.
  dns_opt:
    - timeout:2
    - attempts:5
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # ---------------------------------------------------------------- infrastructure
  postgres:
    <<: *service-defaults
    image: postgres:17
    mem_limit: 512m
    # Sized for a laptop: 8 services x Hikari max 5 = 40 connections, well under max_connections.
    command: ["postgres", "-c", "max_connections=100", "-c", "shared_buffers=128MB", "-c", "effective_cache_size=384MB", "-c", "maintenance_work_mem=64MB", "-c", "wal_buffers=8MB"]
    stop_grace_period: 30s
    environment:
      POSTGRES_DB: financial_platform
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app_user} -d financial_platform"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot: creates any missing service database. Idempotent; runs on every "up".
  db-init:
    image: postgres:17
    restart: "no"
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-app_user}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGDATABASE: financial_platform
    command: ["psql", "-v", "ON_ERROR_STOP=1", "-f", "/init/01-create-service-databases.sql"]
    volumes:
      - ./infrastructure/postgres/initdb:/init:ro
    depends_on:
      postgres:
        condition: service_healthy

  kafka:
    <<: *service-defaults
    image: apache/kafka:4.4.0
    mem_limit: 1g
    stop_grace_period: 30s
    environment:
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
      # Single-node dev broker: a 512m heap is ample and the default 1g is not needed.
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
      KAFKA_JVM_PERFORMANCE_OPTS: "-XX:+UseSerialGC -XX:TieredStopAtLevel=1"
      KAFKA_NUM_NETWORK_THREADS: "3"
      KAFKA_NUM_IO_THREADS: "4"
      # Single-node KRaft: the broker's own controller heartbeats time out when the Docker VM is
      # CPU-starved (the cause of "KRaft heartbeat timeout" errors). Generous timeouts ride out
      # short starvation instead of forcing a leader re-election and consumer-group churn.
      KAFKA_CONTROLLER_QUORUM_REQUEST_TIMEOUT_MS: "15000"
      KAFKA_CONTROLLER_QUORUM_ELECTION_TIMEOUT_MS: "5000"
      KAFKA_BROKER_SESSION_TIMEOUT_MS: "30000"
      # Routine per-heartbeat INFO logging costs CPU and buries real errors.
      KAFKA_LOG4J_ROOT_LOGLEVEL: "WARN"
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:${KAFKA_HOST_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # /var/lib/kafka/data is owned by the broker user in the image, so a fresh named volume is writable.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    ports:
      - "${KAFKA_HOST_PORT:-9092}:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      # The check starts a JVM CLI, which can take well over 10s on a loaded Docker VM.
      # Each probe starts a JVM CLI, so it runs every 30s rather than 15s to keep idle CPU low.
      interval: 30s
      timeout: 30s
      retries: 20
      start_period: 60s

  # ---------------------------------------------------------------- services
  customer-service:
    <<: *service-defaults
    build:
      context: customer-service
    image: capitec/customer-service:${IMAGE_TAG:-local}
    mem_limit: 640m
    stop_grace_period: 30s
    environment:
      DB_URL: "jdbc:postgresql://postgres:5432/customer_service_db"
      DB_USERNAME: "${POSTGRES_USER:-app_user}"
      DB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env (same value as POSTGRES_PASSWORD)}"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:19092"
      JAVA_OPTS: "-XX:MaxRAMPercentage=60 -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:+ExitOnOutOfMemoryError"
      SERVER_SHUTDOWN: "graceful"
      SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: "20s"
      SPRING_JPA_SHOW_SQL: "false"
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "5"
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "1"
    ports:
      - "${CUSTOMER_SERVICE_HOST_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy

  account-service:
    <<: *service-defaults
    build:
      context: account-service
    image: capitec/account-service:${IMAGE_TAG:-local}
    mem_limit: 640m
    stop_grace_period: 30s
    environment:
      DB_URL: "jdbc:postgresql://postgres:5432/account_service_db"
      DB_USERNAME: "${POSTGRES_USER:-app_user}"
      DB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env (same value as POSTGRES_PASSWORD)}"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:19092"
      JAVA_OPTS: "-XX:MaxRAMPercentage=60 -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:+ExitOnOutOfMemoryError"
      SERVER_SHUTDOWN: "graceful"
      SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: "20s"
      SPRING_JPA_SHOW_SQL: "false"
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "5"
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "1"
      TRANSACTION_SERVICE_URL: "http://transaction-service:8083"
      CUSTOMER_SERVICE_URL: "http://customer-service:8081"
    ports:
      - "${ACCOUNT_SERVICE_HOST_PORT:-8082}:8082"
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      customer-service:
        condition: service_healthy

  transaction-service:
    <<: *service-defaults
    build:
      context: transaction-service
    image: capitec/transaction-service:${IMAGE_TAG:-local}
    mem_limit: 640m
    stop_grace_period: 30s
    environment:
      DB_URL: "jdbc:postgresql://postgres:5432/transaction_service_db"
      DB_USERNAME: "${POSTGRES_USER:-app_user}"
      DB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env (same value as POSTGRES_PASSWORD)}"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:19092"
      JAVA_OPTS: "-XX:MaxRAMPercentage=60 -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:+ExitOnOutOfMemoryError"
      SERVER_SHUTDOWN: "graceful"
      SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: "20s"
      SPRING_JPA_SHOW_SQL: "false"
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "5"
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "1"
      ACCOUNT_SERVICE_URL: "http://account-service:8082"
    ports:
      - "${TRANSACTION_SERVICE_HOST_PORT:-8083}:8083"
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      account-service:
        condition: service_healthy

  aggregation-service:
    <<: *service-defaults
    build:
      context: aggregation-service
    image: capitec/aggregation-service:${IMAGE_TAG:-local}
    mem_limit: 640m
    stop_grace_period: 30s
    environment:
      DB_URL: "jdbc:postgresql://postgres:5432/transaction_aggregation_db"
      DB_USERNAME: "${POSTGRES_USER:-app_user}"
      DB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env (same value as POSTGRES_PASSWORD)}"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:19092"
      JAVA_OPTS: "-XX:MaxRAMPercentage=60 -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:+ExitOnOutOfMemoryError"
      SERVER_SHUTDOWN: "graceful"
      SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: "20s"
      SPRING_JPA_SHOW_SQL: "false"
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "5"
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "1"
      ACCOUNT_SERVICE_URL: "http://account-service:8082"
      AGGREGATION_JWT_SECRET: "${AGGREGATION_JWT_SECRET:?Set AGGREGATION_JWT_SECRET in .env}"
      AGGREGATION_JWT_ISSUER: "${AGGREGATION_JWT_ISSUER:-transaction-aggregation-demo}"
    ports:
      - "${AGGREGATION_SERVICE_HOST_PORT:-8088}:8088"
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      account-service:
        condition: service_healthy

  api-gateway:
    <<: *service-defaults
    build:
      context: api-gateway
    image: capitec/api-gateway:${IMAGE_TAG:-local}
    mem_limit: 640m
    stop_grace_period: 30s
    environment:
      JAVA_OPTS: "-XX:MaxRAMPercentage=60 -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:+ExitOnOutOfMemoryError"
      SERVER_SHUTDOWN: "graceful"
      SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: "20s"
      SPRING_JPA_SHOW_SQL: "false"
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "5"
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "1"
      AGGREGATION_JWT_SECRET: "${AGGREGATION_JWT_SECRET:?Set AGGREGATION_JWT_SECRET in .env}"
      AGGREGATION_JWT_ISSUER: "${AGGREGATION_JWT_ISSUER:-transaction-aggregation-demo}"
      CUSTOMER_SERVICE_URL: "http://customer-service:8081"
      ACCOUNT_SERVICE_URL: "http://account-service:8082"
      TRANSACTION_SERVICE_URL: "http://transaction-service:8083"
      AGGREGATION_SERVICE_URL: "http://aggregation-service:8088"
    ports:
      - "${API_GATEWAY_HOST_PORT:-8000}:8000"
    depends_on:
      customer-service:
        condition: service_healthy
      account-service:
        condition: service_healthy
      transaction-service:
        condition: service_healthy
      aggregation-service:
        condition: service_healthy

  frontend:
    <<: *service-defaults
    build:
      context: frontend
    image: capitec/frontend:${IMAGE_TAG:-local}
    mem_limit: 64m
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:80"
    depends_on:
      api-gateway:
        condition: service_healthy

volumes:
  postgres_data:
  kafka_data:
