spring.application.name=api-gateway
server.port=${GATEWAY_PORT:8000}
customer.service.url=${CUSTOMER_SERVICE_URL:http://localhost:8081}
account.service.url=${ACCOUNT_SERVICE_URL:http://localhost:8082}
transaction.service.url=${TRANSACTION_SERVICE_URL:http://localhost:8083}
aggregation.service.url=${AGGREGATION_SERVICE_URL:http://localhost:8088}
spring.cloud.gateway.server.webmvc.routes[0].id=customer-service
spring.cloud.gateway.server.webmvc.routes[0].uri=${customer.service.url}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/v1/customers,/api/v1/customers/**
spring.cloud.gateway.server.webmvc.routes[1].id=account-service
spring.cloud.gateway.server.webmvc.routes[1].uri=${account.service.url}
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/v1/accounts,/api/v1/accounts/**
spring.cloud.gateway.server.webmvc.routes[2].id=transaction-service
spring.cloud.gateway.server.webmvc.routes[2].uri=${transaction.service.url}
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/v1/transactions,/api/v1/transactions/**
spring.cloud.gateway.server.webmvc.routes[3].id=aggregation-service
spring.cloud.gateway.server.webmvc.routes[3].uri=${aggregation.service.url}
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/v1/aggregation,/api/v1/aggregation/**
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
mvp.session.jwt-secret=${AGGREGATION_JWT_SECRET}
mvp.session.jwt-issuer=${AGGREGATION_JWT_ISSUER:transaction-aggregation-demo}
