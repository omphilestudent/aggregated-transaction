name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  java-tests:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - customer-service
          - account-service
          - transaction-service
          - case-service
          - aggregation-service
          - api-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml
      - name: Run unit tests
        working-directory: ${{ matrix.service }}
        run: ./mvnw -B test

  frontend:
    name: Lint and build frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  stack:
    name: Build images and run smoke test
    needs: [java-tests, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create .env with generated secrets
        run: |
          cp .env.example .env
          DB_PW="$(openssl rand -hex 16)"
          sed -i "s/replace-with-local-db-password/${DB_PW}/g" .env
          sed -i "s/replace-with-32-plus-random-bytes/$(openssl rand -hex 32)/" .env
      - name: Create build truststore
        run: scripts/dev/generate-truststore.sh
      - name: Start stack
        run: docker compose up -d --build --wait --wait-timeout 1800
      - name: Smoke test
        run: scripts/dev/smoke-test.sh
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 300
      - name: Tear down
        if: always()
        run: |
          # .env is git-ignored, so it does not exist when an earlier step failed before it was created.
          # Compose needs its required variables to parse the file, so fall back to the template.
          ENV_FILE=.env
          [ -f .env ] || ENV_FILE=.env.example
          docker compose --env-file "$ENV_FILE" down -v --remove-orphans
